version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: nova-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nova_db
      POSTGRES_USER: nova_admin
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DB_DEMO_PASSWORD: ${DB_DEMO_PASSWORD:?Set DB_DEMO_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
    ports:
      - "5432:5432"
    volumes:
      - nova_postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
      - ./database/demo_seed.sql:/docker-entrypoint-initdb.d/03_demo_seed.sql
    networks:
      - nova-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U nova_admin -d nova_db" ]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  nova-network:
    driver: bridge

volumes:
  nova_postgres_data:
